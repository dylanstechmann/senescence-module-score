name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          OPENBLAS_NUM_THREADS: '1'
      - name: Verify installed wheel contains offline signature assets
        run: |
          python -m pip wheel --no-deps . -w /tmp/senescore-wheels
          python -m pip install --no-deps --target /tmp/senescore-installed /tmp/senescore-wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/senescore-installed python -m senescore.cli demo
