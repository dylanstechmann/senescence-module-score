[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senescore"
version = "0.1.0"
description = "Control-gene module score for the published SenMayo set."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dylan Stechmann"}]
dependencies = [
  "numpy",
]

[project.scripts]
senescore = "senescore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
